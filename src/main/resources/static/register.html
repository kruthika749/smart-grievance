<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Registration - Smart Grievance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef5ff, #ffffff);
            padding: 30px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 30px;
            font-weight: bold;
            color: #1d4ed8;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }
        
        input:focus {
            border-color: #2563eb;
        }
        
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        
        .otp-btn {
            background: #2563eb;
            color: white;
        }
        
        .otp-btn:hover {
            background: #1d4ed8;
        }
        
        .verify-btn {
            background: #16a34a;
            color: white;
        }
        
        .verify-btn:hover {
            background: #15803d;
        }
        
        .register-btn {
            background: #7c3aed;
            color: white;
            margin-top: 18px;
        }
        
        .register-btn:hover {
            background: #6d28d9;
        }
        
        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        
        .otp-box {
            margin-top: 15px;
            padding: 15px;
            background: #fff7d6;
            border: 1px solid #f0c36d;
            border-radius: 10px;
            display: none;
        }
        
        .otp-box strong {
            color: #92400e;
        }
        
        .otp-value {
            margin-top: 8px;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #b45309;
            text-align: center;
        }
        
        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 14px;
        }
        
        .success {
            background: #dcfce7;
            color: #166534;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
        }
        
        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .verified {
            color: #16a34a;
            font-weight: bold;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">Smart Grievance</div>

        <div class="subtitle">
            Citizen Registration Portal
        </div>

        <h2>Create Your Account</h2>

        <!-- NAME -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
        </div>

        <!-- EMAIL -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <!-- MOBILE -->
        <div class="form-group">
            <label for="mobile">Mobile Number</label>

            <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" maxlength="10">

            <button type="button" class="otp-btn" onclick="sendOtp()">
            Send Demo OTP
        </button>
        </div>

        <!-- DEMO OTP -->
        <div id="otpBox" class="otp-box">

            <strong>Demo OTP</strong>

            <p>
                Since this is a demo system, the OTP is displayed here instead of being sent by SMS.
            </p>

            <div id="otpValue" class="otp-value"></div>

        </div>

        <!-- ENTER OTP -->
        <div class="form-group" style="margin-top: 18px;">

            <label for="otp">Enter OTP</label>

            <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">

            <button type="button" class="verify-btn" onclick="verifyOtp()">
            Verify OTP
        </button>

            <div id="verifiedMessage" class="verified">
                ✓ Mobile number verified
            </div>

        </div>

        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">Password</label>

            <div style="position: relative;">

                <input type="password" id="password" placeholder="Create a password" style="padding-right: 45px;">

                <button type="button" onclick="togglePassword()" id="eyeButton" style="
                       position: absolute;
                       right: 10px;
                       top: 50%;
                       transform: translateY(-50%);
                       width: auto;
                       margin: 0;
                       padding: 5px;
                       background: none;
                       color: #555;
                       font-size: 20px;
                       cursor: pointer;
                    ">
                    👁
                </button>

            </div>

        </div>

        <!-- REGISTER -->
        <button type="button" class="register-btn" id="registerButton" onclick="registerCitizen()">
        Create Citizen Account
    </button>

        <!-- MESSAGE -->
        <div id="message" class="message"></div>

        <!-- LOGIN -->
        <div class="login-link">

            Already have an account?

            <a href="login.html">
            Login here
        </a>

        </div>

    </div>


    <script>
        let otpVerified = false;


        /* ==============================
           SHOW MESSAGE
           ============================== */

        function showMessage(text, type) {

            const message =
                document.getElementById("message");

            message.innerText = text;

            message.className =
                "message " + type;

            message.style.display = "block";
        }


        /* ==============================
           SEND OTP
           ============================== */

        async function sendOtp() {

            const mobile =
                document.getElementById("mobile").value.trim();

            if (!/^[0-9]{10}$/.test(mobile)) {

                showMessage(
                    "Please enter a valid 10-digit mobile number.",
                    "error"
                );

                return;
            }

            try {

                const response =
                    await fetch(
                        `/send-otp?mobile=${encodeURIComponent(mobile)}`
                    );

                const result =
                    await response.text();

                /*
                 * Backend returns:
                 *
                 * OTP generated successfully.
                 * Demo OTP: 123456
                 */

                const otpMatch =
                    result.match(/Demo OTP:\s*(\d{6})/);

                if (otpMatch) {

                    const otp =
                        otpMatch[1];

                    document.getElementById("otpValue")
                        .innerText = otp;

                    document.getElementById("otpBox")
                        .style.display = "block";

                    showMessage(
                        "Demo OTP generated successfully.",
                        "success"
                    );

                } else {

                    showMessage(
                        result,
                        "error"
                    );
                }

            } catch (error) {

                showMessage(
                    "Unable to generate OTP. Please try again.",
                    "error"
                );
            }
        }


        /* ==============================
           VERIFY OTP
           ============================== */

        async function verifyOtp() {

            const mobile =
                document.getElementById("mobile").value.trim();

            const otp =
                document.getElementById("otp").value.trim();

            if (!/^[0-9]{10}$/.test(mobile)) {

                showMessage(
                    "Please enter a valid mobile number.",
                    "error"
                );

                return;
            }

            if (!/^[0-9]{6}$/.test(otp)) {

                showMessage(
                    "Please enter the 6-digit OTP.",
                    "error"
                );

                return;
            }

            try {

                const response =
                    await fetch(
                        `/verify-otp?mobile=${encodeURIComponent(mobile)}&otp=${encodeURIComponent(otp)}`
                    );

                const result =
                    await response.text();

                if (
                    result.toLowerCase()
                    .includes("successfully")
                ) {

                    otpVerified = true;

                    document.getElementById(
                        "verifiedMessage"
                    ).style.display = "block";

                    showMessage(
                        "Mobile number verified successfully!",
                        "success"
                    );

                } else {

                    otpVerified = false;

                    showMessage(
                        result,
                        "error"
                    );
                }

            } catch (error) {

                showMessage(
                    "Unable to verify OTP. Please try again.",
                    "error"
                );
            }
        }


        /* ==============================
           REGISTER CITIZEN
           ============================== */

        async function registerCitizen() {



            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const mobile =
                document.getElementById("mobile").value.trim();

            const password =
                document.getElementById("password").value;

            if (!name || !email || !mobile || !password) {

                showMessage(
                    "Please fill in all the fields.",
                    "error"
                );

                return;
            }

            if (!/^[0-9]{10}$/.test(mobile)) {

                showMessage(
                    "Please enter a valid 10-digit mobile number.",
                    "error"
                );

                return;
            }

            if (!otpVerified) {

                showMessage(
                    "Please verify your mobile number using OTP first.",
                    "error"
                );

                return;
            }

            if (password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }

            try {

                const url =
                    `/register?name=${encodeURIComponent(name)}` +
                    `&email=${encodeURIComponent(email)}` +
                    `&mobile=${encodeURIComponent(mobile)}` +
                    `&password=${encodeURIComponent(password)}`;

                const response =
                    await fetch(
                        url, {
                            method: "POST"
                        }
                    );

                const result =
                    await response.text();

                if (
                    result
                    .toLowerCase()
                    .includes("successfully")
                ) {

                    showMessage(
                        "Account created successfully! Redirecting to login...",
                        "success"
                    );

                    document.getElementById(
                        "registerButton"
                    ).disabled = true;

                    setTimeout(
                        () => {
                            window.location.href =
                                "login.html";
                        },
                        2000
                    );

                } else {

                    showMessage(
                        result,
                        "error"
                    );
                }

            } catch (error) {

                showMessage(
                    "Registration failed. Please try again.",
                    "error"
                );
            }
        }

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eyeButton =
                document.getElementById("eyeButton");

            if (password.type === "password") {

                password.type = "text";
                eyeButton.innerText = "🙈";

            } else {

                password.type = "password";
                eyeButton.innerText = "👁";

            }
        }
    </script>

</body>

</html>
