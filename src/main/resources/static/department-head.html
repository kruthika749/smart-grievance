<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Department Head Dashboard - Smart Grievance</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        
        nav {
            background: #0f172a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav h2 {
            margin: 0;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        
        .container {
            max-width: 1250px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            margin-bottom: 8px;
        }
        
        .header p {
            color: #64748b;
        }
        
        .department-selector {
            background: white;
            padding: 24px;
            border-radius: 14px;
            margin-bottom: 28px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .department-selector label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        select {
            width: 480px;
            max-width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }
        
        .grievance-card {
            background: white;
            border-radius: 14px;
            padding: 26px;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .grievance-id {
            font-size: 21px;
            font-weight: bold;
        }
        
        .status {
            padding: 8px 16px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }
        
        .grievance-text {
            margin: 22px 0;
            font-size: 17px;
        }
        
        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        
        .detail {
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
        }
        
        .label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
        }
        
        .value {
            font-weight: bold;
        }
        
        .actions {
            margin-top: 22px;
            display: flex;
            gap: 10px;
        }
        
        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .progress-btn {
            background: #2563eb;
        }
        
        .resolve-btn {
            background: #16a34a;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            opacity: 1;
        }
        
        .empty {
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 14px;
            color: #64748b;
        }
        
        .loading {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 10px;
        }
        
        @media (max-width: 700px) {
            nav {
                padding: 15px 20px;
            }
            nav {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
            .details {
                grid-template-columns: 1fr;
            }
            .top-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .actions {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
        /* Smart Grievance shared cream / terracotta / olive theme */
        
         :root {
            --sg-cream: #fffaf2;
            --sg-cream-deep: #f7efe2;
            --sg-terracotta: #b94f31;
            --sg-terracotta-dark: #9e3f27;
            --sg-olive: #59643b;
            --sg-ink: #202018;
            --sg-muted: #716e63;
            --sg-border: #e5d2bb;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, var(--sg-cream) 0%, #f7f0e5 100%);
            color: var(--sg-ink);
        }
        
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            width: 100%;
            min-height: 94px;
            padding: 14px clamp(18px, 4vw, 58px);
            background: rgba(255, 252, 246, .98);
            border-bottom: 1px solid rgba(185, 79, 49, .12);
            box-shadow: 0 5px 18px rgba(65, 47, 29, .06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            color: var(--sg-ink);
        }
        
        .site-nav .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            color: inherit;
            text-decoration: none;
            margin: 0;
        }
        
        .site-nav .brand-logo {
            display: block;
            width: 48px;
            height: 48px;
            object-fit: contain;
            flex-shrink: 0;
        }
        
        .site-nav .brand-copy {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .site-nav .brand-copy strong {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(20px, 2vw, 27px);
            line-height: 1.05;
            color: var(--sg-terracotta);
            white-space: nowrap;
        }
        
        .site-nav .brand-copy strong span {
            color: var(--sg-olive);
        }
        
        .site-nav .brand-copy small {
            color: var(--sg-muted);
            font-size: 11px;
        }
        
        .site-nav .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .site-nav .nav-links a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 0;
            padding: 11px 14px;
            border-radius: 10px;
            color: var(--sg-ink);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: background .18s ease, color .18s ease;
        }
        
        .site-nav .nav-links a:hover,
        .site-nav .nav-links a:focus-visible {
            background: var(--sg-cream-deep);
            color: var(--sg-terracotta-dark);
            outline: none;
        }
        
        .site-nav .nav-links a span {
            font-size: 17px;
            line-height: 1;
        }
        
        .container {
            max-width: 1320px;
            margin: 34px auto;
            padding: 0 clamp(16px, 3vw, 32px);
        }
        
        .header {
            padding: clamp(24px, 4vw, 42px);
            margin-bottom: 26px;
            border: 1px solid var(--sg-border);
            border-radius: 22px;
            background: linear-gradient(120deg, #fffdf8 0%, #f4e7d4 100%);
            box-shadow: 0 10px 28px rgba(75, 53, 31, .06);
        }
        
        .header h1 {
            margin-top: 0;
            color: var(--sg-ink);
            font-size: clamp(27px, 3vw, 36px);
        }
        
        .header p {
            margin-bottom: 0;
            color: var(--sg-muted);
            line-height: 1.6;
        }
        
        .department-selector,
        .grievance-card,
        .empty,
        .loading {
            border: 1px solid var(--sg-border);
            border-radius: 18px;
            background: rgba(255, 253, 248, .96);
            box-shadow: 0 8px 24px rgba(75, 53, 31, .06);
        }
        
        .department-selector {
            padding: clamp(20px, 3vw, 28px);
        }
        
        .department-selector label {
            color: var(--sg-ink);
        }
        
        select {
            width: min(480px, 100%);
            border: 1px solid #d8c5ad;
            border-radius: 10px;
            color: var(--sg-ink);
            background: #fffdf8;
            outline-color: var(--sg-terracotta);
        }
        
        .grievance-card {
            padding: clamp(20px, 3vw, 28px);
            transition: box-shadow .2s ease;
        }
        
        .grievance-card:hover {
            box-shadow: 0 12px 30px rgba(75, 53, 31, .09);
        }
        
        .grievance-id {
            color: var(--sg-ink);
        }
        
        .status {
            background: #e1e4cf;
            color: #4d5931;
        }
        
        .detail {
            background: #f8f3ea;
            border: 1px solid rgba(229, 210, 187, .55);
        }
        
        .label {
            color: var(--sg-muted);
        }
        
        .progress-btn,
        .resolve-btn {
            border-radius: 10px;
            transition: background .18s ease, transform .18s ease;
        }
        
        .progress-btn {
            background: var(--sg-olive);
        }
        
        .resolve-btn {
            background: var(--sg-terracotta);
        }
        
        .progress-btn:hover,
        .resolve-btn:hover {
            opacity: 1;
            transform: translateY(-1px);
        }
        
        .progress-btn:hover {
            background: #485331;
        }
        
        .resolve-btn:hover {
            background: var(--sg-terracotta-dark);
        }
        
        button:disabled {
            background: #d7d1c6;
            color: #6f6a60;
        }
        
        .empty {
            color: var(--sg-muted);
        }
        
        .error {
            border: 1px solid #efb7aa;
            background: #fff0eb;
            color: #8e3324;
        }
        
        @media (max-width: 850px) {
            .site-nav {
                flex-direction: column;
                justify-content: center;
                gap: 12px;
                padding: 15px 18px;
            }
            .site-nav .brand {
                justify-content: center;
            }
            .site-nav .nav-links {
                justify-content: center;
                width: 100%;
            }
            .site-nav .nav-links a {
                padding: 10px 11px;
                font-size: 13px;
            }
        }
        
        @media (max-width: 700px) {
            .container {
                margin: 22px auto;
            }
            .department-selector {
                padding: 18px;
            }
            .grievance-card {
                padding: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .site-nav .brand-logo {
                width: 42px;
                height: 42px;
            }
            .site-nav .brand-copy strong {
                font-size: 21px;
            }
            .site-nav .brand-copy small {
                font-size: 10px;
            }
            .site-nav .nav-links {
                gap: 4px;
            }
            .site-nav .nav-links a {
                padding: 9px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="site-nav">
        <a class="brand" href="index.html" aria-label="Smart Grievance home">
            <img src="logo-symbol.png" alt="" class="brand-logo">
            <span class="brand-copy">
                <strong>Smart <span>Grievance</span></strong>
            <small>Your Voice. A Better Tomorrow.</small>
            </span>
        </a>
        <div class="nav-links">
            <a href="index.html"><span aria-hidden="true">⌂</span> Home</a>
            <a href="submit.html"><span aria-hidden="true">▤</span> Submit Grievance</a>
            <a href="my-grievances.html"><span aria-hidden="true">◉</span> My Grievances</a>
        </div>
    </nav>


    <div class="container">

        <div class="header">

            <h1>Department Head Dashboard</h1>

            <p>
                View and manage grievances assigned to your department.
            </p>

        </div>


        <div class="department-selector">

            <label for="department">
                Select Department
            </label>

            <select id="department" onchange="loadGrievances()">

                <option value="Water Supply">
                    Water Supply
                </option>

                <option value="Electricity Department">
                    Electricity Department
                </option>

                <option value="Solid Waste Management">
                    Solid Waste Management
                </option>

                <option value="Roads & Infrastructure">
                    Roads & Infrastructure
                </option>

                <option value="Drainage & Sewage">
                    Drainage & Sewage
                </option>

                <option value="Streetlight Department">
                    Streetlight Department
                </option>

                <option value="Public Safety Department">
                    Public Safety Department
                </option>

                <option value="Health Department">
                    Health Department
                </option>

                <option value="Education Department">
                    Education Department
                </option>

                <option value="Public Transport">
                    Public Transport
                </option>

                <option value="Traffic Management">
                    Traffic Management
                </option>

                <option value="Public Toilet Maintenance">
                    Public Toilet Maintenance
                </option>

                <option value="Parks & Horticulture">
                    Parks & Horticulture
                </option>

                <option value="Animal Control">
                    Animal Control
                </option>

                <option value="Environment Department">
                    Environment Department
                </option>

                <option value="Housing Department">
                    Housing Department
                </option>

                <option value="Accessibility Services">
                    Accessibility Services
                </option>

                <option value="Municipal Services">
                    Municipal Services
                </option>

                <option value="General Grievance Cell">
                    General Grievance Cell
                </option>

            </select>

        </div>


        <div id="grievancesContainer">

            <div class="loading">
                Loading grievances...
            </div>

        </div>

    </div>


    <script>
        async function loadGrievances() {

            const container =
                document.getElementById(
                    "grievancesContainer"
                );

            const selectedDepartment =
                document.getElementById(
                    "department"
                ).value;


            container.innerHTML = `
                <div class="loading">
                    Loading grievances...
                </div>
            `;


            try {

                const response =
                    await fetch("/grievances");


                if (!response.ok) {

                    throw new Error(
                        "Unable to load grievances"
                    );

                }


                const grievances =
                    await response.json();


                const departmentGrievances =
                    grievances.filter(
                        g =>
                        g.department &&
                        g.department.toLowerCase() ===
                        selectedDepartment.toLowerCase()
                    );


                if (
                    departmentGrievances.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty">

                            <h2>
                                No grievances found
                            </h2>

                            <p>
                                There are currently no
                                grievances assigned to
                                ${selectedDepartment}.
                            </p>

                        </div>

                    `;

                    return;
                }


                container.innerHTML =

                    departmentGrievances.map(g => `

                        <div class="grievance-card">


                            <div class="top-row">

                                <div class="grievance-id">

                                    Grievance #${g.id}

                                </div>


                                <div class="status">

                                    ${g.status || "Pending"}

                                </div>

                            </div>


                            <div class="grievance-text">

                                ${g.grievance || ""}

                            </div>


                            <div class="details">


                                <div class="detail">

                                    <div class="label">
                                        Category
                                    </div>

                                    <div class="value">

                                        ${g.category ||
                                        "Not classified"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Priority
                                    </div>

                                    <div class="value">

                                        ${g.priority ||
                                        "Not assigned"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Department
                                    </div>

                                    <div class="value">

                                        ${g.department ||
                                        "Not assigned"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Location
                                    </div>

                                    <div class="value">

                                        ${g.location ||
                                        "Not provided"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        SLA
                                    </div>

                                    <div class="value">

                                        ${g.slaHours || "-"}
                                        hours

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Escalation
                                    </div>

                                    <div class="value">

                                        ${g.escalationStatus ||
                                        "Not Escalated"}

                                    </div>

                                </div>


                            </div>


                            <div class="actions">

                                <button
                                    class="progress-btn"
                                    onclick="updateStatus(
                                        ${g.id},
                                        'In Progress'
                                    )"
                                    ${g.status === "Resolved"
                                        ? "disabled"
                                        : ""}>

                                    Mark In Progress

                                </button>


                                <button
                                    class="resolve-btn"
                                    onclick="updateStatus(
                                        ${g.id},
                                        'Resolved'
                                    )"
                                    ${g.status === "Resolved"
                                        ? "disabled"
                                        : ""}>

                                    Mark Resolved

                                </button>

                            </div>


                        </div>

                    `).join("");

            } catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="error">

                        <strong>Error:</strong>

                        Unable to load grievances.

                    </div>

                `;

            }

        }


        async function updateStatus(
            id,
            status
        ) {

            try {

                const response =
                    await fetch(
                        `/grievances/${id}/status?status=${encodeURIComponent(status)}`, {
                            method: "PUT"
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    alert(
                        "Unable to update grievance status."
                    );

                    return;

                }


                alert(result);


                loadGrievances();

            } catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to the server."
                );

            }

        }


        loadGrievances();
    </script>

</body>

</html>
