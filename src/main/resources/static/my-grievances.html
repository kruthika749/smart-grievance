<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Grievances - Smart Grievance</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        
        nav {
            background: #0f172a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav h2 {
            margin: 0;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .header {
            margin-bottom: 25px;
        }
        
        .header h1 {
            margin-bottom: 8px;
        }
        
        .header p {
            color: #64748b;
        }
        /* =========================
           NOTIFICATIONS
           ========================= */
        
        .notification-section {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        
        .notification-header h2 {
            margin: 0;
        }
        
        #unreadCount {
            background: #2563eb;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        
        .notification-card {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        
        .notification-card.read {
            background: #f8fafc;
            border-left-color: #94a3b8;
        }
        
        .notification-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
        }
        
        .notification-message {
            color: #475569;
            line-height: 1.5;
        }
        
        .notification-time {
            color: #64748b;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .read-btn {
            margin-top: 10px;
            border: none;
            background: #2563eb;
            color: white;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .read-btn:hover {
            opacity: 0.9;
        }
        
        .no-notifications {
            color: #64748b;
            padding: 15px 0;
        }
        /* =========================
           GRIEVANCE CARDS
           ========================= */
        
        .grievance-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .grievance-id {
            font-size: 20px;
            font-weight: bold;
        }
        
        .status {
            padding: 7px 14px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }
        
        .grievance-text {
            margin: 18px 0;
            font-size: 17px;
        }
        
        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .detail {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }
        
        .label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }
        
        .value {
            font-weight: bold;
        }
        /* =========================
           CITIZEN VERIFICATION
           ========================= */
        
        .verification-section {
            margin-top: 22px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
            border-left: 4px solid #2563eb;
        }
        
        .verification-section h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }
        
        .verification-section p {
            color: #64748b;
            margin-bottom: 18px;
        }
        
        .verification-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .accept-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .accept-btn:hover {
            opacity: 0.9;
        }
        
        .reject-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .reject-btn:hover {
            opacity: 0.9;
        }
        /* =========================
   REPORT AN ISSUE
   ========================= */
        
        .report-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }
        
        .report-btn {
            background: #b65335;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .report-btn:hover {
            background: #913f2a;
        }
        
        .verified-message {
            margin-top: 22px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .reopened-message {
            margin-top: 22px;
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        /* =========================
           MOBILE RESPONSIVE
           ========================= */
        
        @media (max-width: 700px) {
            nav {
                padding: 15px 20px;
            }
            .details {
                grid-template-columns: 1fr;
            }
            .top-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .verification-buttons {
                flex-direction: column;
            }
            .accept-btn,
            .reject-btn {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <nav>

        <h2>Smart Grievance</h2>

        <div>

            <a href="index.html">Home</a>

            <a href="submit.html">Submit</a>

            <a href="my-grievances.html">
                My Grievances
            </a>

        </div>

    </nav>


    <div class="container">

        <div class="header">

            <h1>My Grievances</h1>

            <p>
                View the grievances submitted from your account.
            </p>

        </div>


        <!-- =========================
             NOTIFICATIONS
             ========================= -->

        <div class="notification-section">

            <div class="notification-header">

                <h2>🔔 Notifications</h2>

                <span id="unreadCount">
                    0 unread
                </span>

            </div>

            <div id="notificationsContainer">

                <div class="loading">
                    Loading notifications...
                </div>

            </div>

        </div>


        <!-- =========================
             GRIEVANCES
             ========================= -->

        <div id="grievancesContainer">

            <div class="loading">
                Loading your grievances...
            </div>

        </div>

    </div>


    <script>
        /*
         * Get logged-in user's ID
         */

        const userId =
            sessionStorage.getItem("userId");


        /*
         * If citizen is not logged in,
         * redirect to login page.
         */

        if (!userId) {

            window.location.href =
                "login.html";

        }


        /* =====================================================
           LOAD NOTIFICATIONS
           ===================================================== */

        async function loadNotifications() {

            const container =
                document.getElementById(
                    "notificationsContainer"
                );

            const unreadCount =
                document.getElementById(
                    "unreadCount"
                );

            try {

                const response =
                    await fetch(
                        `/notifications/user/${userId}`
                    );

                if (!response.ok) {

                    throw new Error(
                        "Unable to load notifications"
                    );

                }

                const notifications =
                    await response.json();


                /*
                 * Count unread notifications
                 */

                const unread =
                    notifications.filter(
                        n => !n.readStatus
                    ).length;


                unreadCount.textContent =
                    unread + " unread";


                /*
                 * No notifications
                 */

                if (notifications.length === 0) {

                    container.innerHTML = `

                        <div class="no-notifications">

                            No notifications yet.

                        </div>

                    `;

                    return;

                }


                /*
                 * Display notifications
                 */

                container.innerHTML =

                    notifications.map(n => `

                        <div class="notification-card
                            ${n.readStatus ? "read" : ""}">

                            <div class="notification-title">

                                ${n.title}

                            </div>


                            <div class="notification-message">

                                ${n.message}

                            </div>


                            <div class="notification-time">

                                ${n.createdAt
                                    ? new Date(
                                        n.createdAt
                                      ).toLocaleString()
                                    : ""}

                            </div>


                            ${
                                !n.readStatus
                                ? `

                                    <button
                                        class="read-btn"
                                        onclick="markNotificationRead(
                                            ${n.id}
                                        )">

                                        Mark as Read

                                    </button>

                                `
                                : `

                                    <div class="notification-time">

                                        ✓ Read

                                    </div>

                                `
                            }

                        </div>

                    `).join("");

            }

            catch (error) {

                console.error(error);

                container.innerHTML = `

                    <div class="error">

                        Unable to load notifications.

                    </div>

                `;

            }

        }


        /* =====================================================
           MARK NOTIFICATION AS READ
           ===================================================== */

        async function markNotificationRead(
            notificationId
        ) {

            try {

                const response =
                    await fetch(
                        `/notifications/${notificationId}/read`,
                        {
                            method: "PUT"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to mark notification as read"
                    );

                }


                loadNotifications();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to update notification."
                );

            }

        }


        /* =====================================================
           LOAD GRIEVANCES
           ===================================================== */

        async function loadGrievances() {

            const container =
                document.getElementById(
                    "grievancesContainer"
                );


            try {

                const response =
                    await fetch(
                        `/grievances/user/${userId}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load grievances"
                    );

                }


                const grievances =
                    await response.json();


                /*
                 * No grievances
                 */

                if (grievances.length === 0) {

                    container.innerHTML = `

                        <div class="empty">

                            <h2>No grievances found</h2>

                            <p>
                                You have not submitted
                                any grievances yet.
                            </p>

                        </div>

                    `;

                    return;

                }


                /*
                 * Display grievances
                 */

                container.innerHTML =

                    grievances.map(g => `

                        <div class="grievance-card">


                            <div class="top-row">

                                <div class="grievance-id">

                                    Grievance #${g.id}

                                </div>


                                <div class="status">

                                    ${g.status || "Pending"}

                                </div>

                            </div>


                            <div class="grievance-text">

                                ${g.grievance || ""}

                            </div>


                            <div class="details">


                                <div class="detail">

                                    <div class="label">
                                        Category
                                    </div>

                                    <div class="value">

                                        ${g.category ||
                                        "Not classified"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Priority
                                    </div>

                                    <div class="value">

                                        ${g.priority ||
                                        "Not assigned"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Department
                                    </div>

                                    <div class="value">

                                        ${g.department ||
                                        "Not assigned"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Location
                                    </div>

                                    <div class="value">

                                        ${g.location ||
                                        "Not provided"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        SLA
                                    </div>

                                    <div class="value">

                                        ${g.slaHours || "-"}
                                        hours

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Escalation
                                    </div>

                                    <div class="value">

                                        ${g.escalationStatus ||
                                        "Not Escalated"}

                                    </div>

                                </div>


                            </div>


                            <!--
                                CITIZEN VERIFICATION

                                Show controls only when
                                department marks Resolved.
                            -->

                            ${
                                g.status === "Resolved" &&
                                g.verificationStatus !== "Accepted"

                                ? `

                                    <div class="verification-section">

                                        <h3>
                                            Is your grievance resolved?
                                        </h3>

                                        <p>

                                            The department has marked
                                            this grievance as resolved.
                                            Please verify whether the
                                            issue has actually been fixed.

                                        </p>


                                        <div class="verification-buttons">


                                            <button
                                                class="accept-btn"
                                                onclick="verifyGrievance(
                                                    ${g.id},
                                                    'Accepted'
                                                )">

                                                ✓ Accept Resolution

                                            </button>


                                            <button
                                                class="reject-btn"
                                                onclick="verifyGrievance(
                                                    ${g.id},
                                                    'Rejected'
                                                )">

                                                ✕ Reject & Reopen

                                            </button>


                                        </div>

                                    </div>

                                `
                                : ""
                            }


                            ${
                                g.verificationStatus === "Accepted"

                                ? `

                                    <div class="verified-message">

                                        ✓ Resolution verified
                                        by citizen

                                    </div>

                                `
                                : ""
                            }


                            ${
                                g.verificationStatus === "Rejected"

                                ? `

                                    <div class="reopened-message">

                                        ↻ Grievance reopened.
                                        The issue has been sent
                                        back to the department.
                                       
                                    </div>

                                `
                                : ""
                            }
                                                            <!-- REPORT AN ISSUE -->

                            <div class="report-section">

                                <button
                                    class="report-btn"
                                    onclick="reportIssue(${g.id})">

                                    🚨 Report an Issue

                                </button>

                            </div>


                        </div>

                    `).join("");

            }

            catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="error">

                        <strong>Error:</strong>

                        Unable to load your grievances.

                    </div>

                `;

            }

        }


        /* =====================================================
           CITIZEN VERIFICATION
           ===================================================== */
        
        /* =====================================================
       REPORT AN ISSUE
   ===================================================== */

          function reportIssue(grievanceId) {

              window.location.href =
        "report-issue.html?grievanceId=" + grievanceId;

}
        async function verifyGrievance(
            id,
            verificationStatus
        ) {

            let comment = "";


            /*
             * Ask reason when rejecting.
             */

            if (
                verificationStatus === "Rejected"
            ) {

                comment =
                    prompt(
                        "Please explain why the grievance is not resolved:"
                    );


                /*
                 * Cancel
                 */

                if (comment === null) {

                    return;

                }

            }


            try {

                const response =
                    await fetch(

                        `/grievances/${id}/verify`
                        + `?verificationStatus=`
                        + encodeURIComponent(
                            verificationStatus
                        )
                        + `&verificationComment=`
                        + encodeURIComponent(
                            comment
                        ),

                        {
                            method: "PUT"
                        }

                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    alert(
                        "Unable to record verification."
                    );

                    return;

                }


                alert(result);


                /*
                 * Refresh both sections.
                 */

                loadGrievances();

                loadNotifications();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to server."
                );

            }

        }


        /* =====================================================
           INITIAL PAGE LOAD
           ===================================================== */

        loadGrievances();

        loadNotifications();
    </script>

</body>

</html>
