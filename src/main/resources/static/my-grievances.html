<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Grievances - Smart Grievance</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        
        nav {
            background: #0f172a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav h2 {
            margin: 0;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .header {
            margin-bottom: 25px;
        }
        
        .header h1 {
            margin-bottom: 8px;
        }
        
        .header p {
            color: #64748b;
        }
        
        .grievance-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .grievance-id {
            font-size: 20px;
            font-weight: bold;
        }
        
        .status {
            padding: 7px 14px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }
        
        .grievance-text {
            margin: 18px 0;
            font-size: 17px;
        }
        
        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .detail {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }
        
        .label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }
        
        .value {
            font-weight: bold;
        }
        /* Citizen verification section */
        
        .verification-section {
            margin-top: 22px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
            border-left: 4px solid #2563eb;
        }
        
        .verification-section h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }
        
        .verification-section p {
            color: #64748b;
            margin-bottom: 18px;
        }
        
        .verification-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .accept-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .accept-btn:hover {
            opacity: 0.9;
        }
        
        .reject-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .reject-btn:hover {
            opacity: 0.9;
        }
        
        .verified-message {
            margin-top: 22px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .reopened-message {
            margin-top: 22px;
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        @media (max-width: 700px) {
            nav {
                padding: 15px 20px;
            }
            .details {
                grid-template-columns: 1fr;
            }
            .top-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .verification-buttons {
                flex-direction: column;
            }
            .accept-btn,
            .reject-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav>

        <h2>Smart Grievance</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="submit.html">Submit</a>
            <a href="my-grievances.html">My Grievances</a>
        </div>

    </nav>


    <div class="container">

        <div class="header">

            <h1>My Grievances</h1>

            <p>
                View the grievances submitted from your account.
            </p>

        </div>


        <div id="grievancesContainer">

            <div class="loading">
                Loading your grievances...
            </div>

        </div>

    </div>


    <script>
        /*
         * Get the actual logged-in user's ID
         * from sessionStorage.
         */
        const userId =
            sessionStorage.getItem("userId");


        /*
         * If the citizen is not logged in,
         * send them back to login.
         */
        if (!userId) {

            window.location.href =
                "login.html";
        }


        async function loadGrievances() {

            const container =
                document.getElementById(
                    "grievancesContainer"
                );


            try {

                const response =
                    await fetch(
                        `/grievances/user/${userId}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load grievances"
                    );

                }


                const grievances =
                    await response.json();


                if (grievances.length === 0) {

                    container.innerHTML = `

                        <div class="empty">

                            <h2>No grievances found</h2>

                            <p>
                                You have not submitted
                                any grievances yet.
                            </p>

                        </div>

                    `;

                    return;
                }


                container.innerHTML =

                    grievances.map(g => `

                        <div class="grievance-card">


                            <div class="top-row">

                                <div class="grievance-id">

                                    Grievance #${g.id}

                                </div>


                                <div class="status">

                                    ${g.status || "Pending"}

                                </div>

                            </div>


                            <div class="grievance-text">

                                ${g.grievance || ""}

                            </div>


                            <div class="details">


                                <div class="detail">

                                    <div class="label">
                                        Category
                                    </div>

                                    <div class="value">

                                        ${g.category ||
                                        "Not classified"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Priority
                                    </div>

                                    <div class="value">

                                        ${g.priority ||
                                        "Not assigned"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Department
                                    </div>

                                    <div class="value">

                                        ${g.department ||
                                        "Not assigned"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Location
                                    </div>

                                    <div class="value">

                                        ${g.location ||
                                        "Not provided"}

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        SLA
                                    </div>

                                    <div class="value">

                                        ${g.slaHours || "-"}
                                        hours

                                    </div>

                                </div>


                                <div class="detail">

                                    <div class="label">
                                        Escalation
                                    </div>

                                    <div class="value">

                                        ${g.escalationStatus ||
                                        "Not Escalated"}

                                    </div>

                                </div>


                            </div>


                            <!--
                                CITIZEN VERIFICATION

                                Show verification controls
                                only when the department has
                                marked the grievance Resolved.
                            -->

                            ${g.status === "Resolved" &&
                              g.verificationStatus !== "Accepted"
                                ? `

                                <div class="verification-section">

                                    <h3>
                                        Is your grievance resolved?
                                    </h3>

                                    <p>
                                        The department has marked
                                        this grievance as resolved.
                                        Please verify whether the
                                        issue has actually been fixed.
                                    </p>


                                    <div class="verification-buttons">

                                        <button
                                            class="accept-btn"
                                            onclick="verifyGrievance(
                                                ${g.id},
                                                'Accepted'
                                            )">

                                            ✓ Accept Resolution

                                        </button>


                                        <button
                                            class="reject-btn"
                                            onclick="verifyGrievance(
                                                ${g.id},
                                                'Rejected'
                                            )">

                                            ✕ Reject & Reopen

                                        </button>

                                    </div>

                                </div>

                            `
                            : ""}


                            <!--
                                SHOW MESSAGE AFTER
                                SUCCESSFUL VERIFICATION
                            -->

                            ${g.verificationStatus === "Accepted"
                                ? `

                                <div class="verified-message">

                                    ✓ Resolution verified
                                    by citizen

                                </div>

                            `
                            : ""}


                            <!--
                                SHOW REOPENED MESSAGE
                                AFTER CITIZEN REJECTS
                            -->

                            ${g.verificationStatus === "Rejected"
                                ? `

                                <div class="reopened-message">

                                    ↻ Grievance reopened.
                                    The issue has been sent
                                    back to the department.

                                </div>

                            `
                            : ""}


                        </div>

                    `).join("");

            }

            catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="error">

                        <strong>Error:</strong>

                        Unable to load your grievances.

                    </div>

                `;

            }

        }


        /*
         * Citizen verification function
         */
        async function verifyGrievance(
            id,
            verificationStatus
        ) {

            let comment = "";


            /*
             * If citizen rejects the resolution,
             * ask for a reason.
             */
            if (
                verificationStatus === "Rejected"
            ) {

                comment =
                    prompt(
                        "Please explain why the grievance is not resolved:"
                    );


                /*
                 * User pressed Cancel.
                 */
                if (comment === null) {

                    return;

                }

            }


            try {

                const response =
                    await fetch(

                        `/grievances/${id}/verify`
                        + `?verificationStatus=`
                        + encodeURIComponent(
                            verificationStatus
                        )
                        + `&verificationComment=`
                        + encodeURIComponent(
                            comment
                        ),

                        {
                            method: "PUT"
                        }

                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    alert(
                        "Unable to record verification."
                    );

                    return;

                }


                alert(result);


                /*
                 * Reload the grievances so the
                 * new status appears immediately.
                 */
                loadGrievances();

            }

            catch (error) {

                console.error(error);


                alert(
                    "Unable to connect to server."
                );

            }

        }


        /*
         * Load grievances when page opens.
         */
        loadGrievances();
    </script>

</body>

</html>
