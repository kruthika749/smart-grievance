<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Login - Smart Grievance</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }
        
        h1 {
            margin-top: 0;
            text-align: center;
            color: #0f172a;
        }
        
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background: #dcfce7;
            color: #166534;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Citizen Login</h1>

            <p class="subtitle">
                Login to access your Smart Grievance account
            </p>

            <form id="loginForm">

                <label for="mobile">
                Mobile Number
            </label>

                <input type="text" id="mobile" placeholder="Enter mobile number" required>

                <label for="password">
                Password
            </label>

                <input type="password" id="password" placeholder="Enter password" required>

                <button type="submit">
                Login
            </button>

            </form>

            <div id="message" class="message"></div>

            <div class="links">
                <a href="index.html">← Back to Home</a>
            </div>

        </div>

    </div>

    <script>
        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const mobile =
                document.getElementById("mobile").value;

            const password =
                document.getElementById("password").value;


            message.style.display = "none";


            try {

                const response = await fetch(
                    `/login?mobile=${encodeURIComponent(mobile)}&password=${encodeURIComponent(password)}`, {
                        method: "POST"
                    }
                );


                const data =
                    await response.json();


                if (data.success) {

                    /*
                     * Store the actual logged-in
                     * user's ID.
                     */
                    sessionStorage.setItem(
                        "userId",
                        data.userId
                    );

                    sessionStorage.setItem(
                        "userName",
                        data.name
                    );

                    sessionStorage.setItem(
                        "userRole",
                        data.role
                    );


                    message.className =
                        "message success";

                    message.style.display =
                        "block";

                    message.textContent =
                        "Login successful!";


                    /*
                     * Give the user a moment to
                     * see the success message.
                     */
                    setTimeout(function() {

                        window.location.href =
                            "my-grievances.html";

                    }, 800);

                } else {

                    message.className =
                        "message error";

                    message.style.display =
                        "block";

                    message.textContent =
                        data.message ||
                        "Invalid login details.";

                }

            } catch (error) {

                console.error(error);

                message.className =
                    "message error";

                message.style.display =
                    "block";

                message.textContent =
                    "Unable to connect to the server.";

            }

        });
    </script>

</body>

</html>
