<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Login - Smart Grievance</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }
        
        h1 {
            margin-top: 0;
            text-align: center;
            color: #0f172a;
        }
        
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #2563eb;
        }
        /* Password wrapper */
        
        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
        }
        
        .password-wrapper input {
            width: 100%;
            margin-bottom: 0;
            padding-right: 50px;
        }
        /* Eye button */
        
        .eye-button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            padding: 0;
            margin: 0;
            border: none;
            background: transparent;
            color: #555;
            font-size: 19px;
            cursor: pointer;
        }
        
        .eye-button:hover {
            background: transparent;
            opacity: 0.7;
        }
        /* Login button */
        
        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .login-button:hover {
            opacity: 0.9;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background: #dcfce7;
            color: #166534;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links a {
            color: #2563eb;
            text-decoration: none;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Citizen Login</h1>

            <p class="subtitle">
                Login to access your Smart Grievance account
            </p>


            <form id="loginForm">

                <!-- MOBILE NUMBER -->

                <label for="mobile">
                    Mobile Number
                </label>

                <input type="text" id="mobile" placeholder="Enter mobile number" maxlength="10" required>


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input type="password" id="password" placeholder="Enter password" required>

                    <button type="button" id="eyeButton" class="eye-button" onclick="togglePassword()">
                        👁
                    </button>

                </div>


                <!-- LOGIN -->

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>


            <!-- MESSAGE -->

            <div id="message" class="message"></div>


            <!-- LINKS -->

            <div class="links">

                <a href="register.html">
                    New citizen? Register here
                </a>

                <br><br>

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script>
        /* =========================================
                           LOGIN
                           ========================================= */

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const mobile =
                    document.getElementById("mobile")
                    .value.trim();

                const password =
                    document.getElementById("password")
                    .value;


                message.style.display = "none";


                try {

                    const response =
                        await fetch(
                            `/login?mobile=${encodeURIComponent(mobile)}&password=${encodeURIComponent(password)}`, {
                                method: "POST"
                            }
                        );


                    const data =
                        await response.json();


                    if (data.success) {

                        /*
                         * Store the actual
                         * logged-in user's details.
                         */

                        sessionStorage.setItem(
                            "userId",
                            data.userId
                        );

                        sessionStorage.setItem(
                            "userName",
                            data.name
                        );

                        sessionStorage.setItem(
                            "userRole",
                            data.role
                        );


                        message.className =
                            "message success";

                        message.style.display =
                            "block";

                        message.textContent =
                            "Login successful!";


                        /*
                         * Redirect to
                         * My Grievances page.
                         */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "my-grievances.html";

                            },
                            800
                        );


                    } else {

                        message.className =
                            "message error";

                        message.style.display =
                            "block";

                        message.textContent =
                            data.message ||
                            "Invalid login details.";

                    }

                } catch (error) {

                    console.error(error);

                    message.className =
                        "message error";

                    message.style.display =
                        "block";

                    message.textContent =
                        "Unable to connect to the server.";

                }

            }
        );


        /* =========================================
           SHOW / HIDE PASSWORD
           ========================================= */

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eyeButton =
                document.getElementById("eyeButton");


            if (password.type === "password") {

                password.type = "text";

                eyeButton.innerText = "🙈";

            } else {

                password.type = "password";

                eyeButton.innerText = "👁";

            }

        }
    </script>

</body>

</html>
