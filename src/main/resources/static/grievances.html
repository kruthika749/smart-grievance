<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grievances | Smart Grievance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        
        body {
            background: #f5f7fb;
            color: #1f2937;
        }
        /* NAVBAR */
        
        nav {
            height: 72px;
            background: #123b6d;
            color: white;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 28px;
            font-size: 15px;
            transition: 0.2s;
        }
        
        nav a:hover {
            opacity: 0.75;
        }
        /* HEADER */
        
        .hero {
            background: linear-gradient(135deg, #123b6d, #1d6fa5);
            color: white;
            padding: 55px 20px 65px;
            text-align: center;
        }
        
        .hero-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }
        
        .hero h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }
        
        .hero p {
            font-size: 16px;
            opacity: 0.9;
        }
        /* MAIN */
        
        .container {
            width: 90%;
            max-width: 1150px;
            margin: -30px auto 60px;
            position: relative;
        }
        /* TOOLBAR */
        
        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        
        .search-box {
            flex: 1;
        }
        
        .search-box input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #d7dee8;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }
        
        .search-box input:focus {
            border-color: #1d6fa5;
        }
        
        .filter-box select {
            padding: 13px 15px;
            border: 1px solid #d7dee8;
            border-radius: 9px;
            background: white;
            font-size: 14px;
            outline: none;
        }
        
        .refresh-btn {
            padding: 13px 20px;
            border: none;
            border-radius: 9px;
            background: #123b6d;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .refresh-btn:hover {
            background: #0d2d52;
        }
        /* SECTION TITLE */
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        
        .section-header h2 {
            color: #123b6d;
            font-size: 23px;
        }
        
        .count {
            color: #6b7280;
            font-size: 14px;
        }
        /* GRID */
        
        #grievanceList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        /* CARD */
        
        .grievance-card {
            background: white;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
            border: 1px solid #e6ebf2;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .grievance-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }
        /* CARD TOP */
        
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        
        .grievance-id {
            font-size: 14px;
            font-weight: 700;
            color: #64748b;
        }
        /* STATUS */
        
        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        
        .status-pending {
            background: #fff4d6;
            color: #946200;
        }
        
        .status-resolved {
            background: #dcfce7;
            color: #166534;
        }
        
        .status-escalated {
            background: #fee2e2;
            color: #b91c1c;
        }
        /* DESCRIPTION */
        
        .grievance-title {
            font-size: 19px;
            color: #123b6d;
            margin-bottom: 8px;
        }
        
        .description {
            color: #596579;
            line-height: 1.55;
            font-size: 14px;
            margin-bottom: 20px;
        }
        /* LOCATION */
        
        .location {
            background: #f3f7fb;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #475569;
            margin-bottom: 18px;
        }
        /* DETAILS GRID */
        
        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }
        
        .detail {
            background: #f8fafc;
            padding: 12px;
            border-radius: 9px;
        }
        
        .detail-label {
            display: block;
            color: #8893a3;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 13px;
            font-weight: 700;
            color: #27364a;
        }
        /* BADGES */
        
        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        
        .category {
            background: #e7f1fb;
            color: #145b91;
        }
        
        .priority-low {
            background: #e5f7eb;
            color: #18733b;
        }
        
        .priority-medium {
            background: #fff4d6;
            color: #946200;
        }
        
        .priority-high {
            background: #ffe8d5;
            color: #b45309;
        }
        
        .priority-critical {
            background: #fee2e2;
            color: #b91c1c;
        }
        /* SLA */
        
        .sla-section {
            border-top: 1px solid #e8edf3;
            padding-top: 16px;
        }
        
        .sla-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
            font-size: 13px;
        }
        
        .sla-label {
            color: #64748b;
        }
        
        .sla-value {
            font-weight: 700;
            color: #334155;
        }
        /* ESCALATION */
        
        .escalation {
            margin-top: 12px;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .not-escalated {
            background: #eef6ff;
            color: #2563a6;
        }
        
        .escalated {
            background: #fee2e2;
            color: #b91c1c;
        }
        /* USER */
        
        .citizen {
            border-top: 1px solid #e8edf3;
            margin-top: 16px;
            padding-top: 15px;
            font-size: 12px;
            color: #64748b;
        }
        
        .citizen strong {
            color: #334155;
        }
        /* LOADING */
        
        .loading {
            grid-column: 1 / -1;
            background: white;
            padding: 60px;
            text-align: center;
            border-radius: 14px;
            color: #64748b;
        }
        /* EMPTY */
        
        .empty {
            grid-column: 1 / -1;
            background: white;
            padding: 60px;
            text-align: center;
            border-radius: 14px;
            color: #64748b;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }
        
        .empty-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }
        /* FOOTER */
        
        footer {
            background: #123b6d;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 13px;
        }
        /* MOBILE */
        
        @media (max-width: 850px) {
            #grievanceList {
                grid-template-columns: 1fr;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .hero h1 {
                font-size: 30px;
            }
        }
        
        @media (max-width: 600px) {
            nav {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 12px;
            }
            nav a {
                margin: 0 8px;
            }
            .container {
                width: 94%;
            }
            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <!-- NAVIGATION -->

    <nav>

        <div class="logo">
            🏛️ Smart Grievance
        </div>

        <div>
            <a href="index.html">Home</a>
            <a href="submit.html">Submit Grievance</a>
        </div>

    </nav>


    <!-- HERO -->

    <section class="hero">

        <div class="hero-icon">
            📋
        </div>

        <h1>Grievance Status</h1>

        <p>
            Track civic complaints, AI classification, SLA and resolution status.
        </p>

    </section>


    <!-- MAIN -->

    <div class="container">

        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="search-box">

                <input type="text" id="searchInput" placeholder="🔍 Search by grievance, location, name or department..." onkeyup="filterGrievances()">

            </div>

            <div class="filter-box">

                <select id="priorityFilter" onchange="filterGrievances()">

                    <option value="ALL">
                        All Priorities
                    </option>

                    <option value="LOW">
                        Low
                    </option>

                    <option value="MEDIUM">
                        Medium
                    </option>

                    <option value="HIGH">
                        High
                    </option>

                    <option value="CRITICAL">
                        Critical
                    </option>

                </select>

            </div>

            <button class="refresh-btn" onclick="loadGrievances()">
                🔄 Refresh
            </button>

        </div>


        <!-- SECTION HEADER -->

        <div class="section-header">

            <h2>
                Reported Grievances
            </h2>

            <span class="count" id="grievanceCount">
                Loading...
            </span>

        </div>


        <!-- LIST -->

        <div id="grievanceList">

            <div class="loading">
                Loading grievances...
            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        © 2026 Smart Grievance Portal
        <br> Intelligent • Transparent • Citizen-Centric

    </footer>


    <script>
        let allGrievances = [];


        function loadGrievances() {

            const list =
                document.getElementById("grievanceList");

            list.innerHTML =
                '<div class="loading">Loading grievances...</div>';

            fetch("/grievances")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Failed to load grievances");
                }

                return response.json();

            })

            .then(data => {

                allGrievances = data;

                displayGrievances(data);

            })

            .catch(error => {

                console.error(error);

                document.getElementById("grievanceCount")
                    .textContent = "Unable to load";

                list.innerHTML = `

                        <div class="empty">

                            <div class="empty-icon">
                                ⚠️
                            </div>

                            <h3>
                                Unable to load grievances
                            </h3>

                            <p>
                                Please make sure the Spring Boot server is running.
                            </p>

                        </div>

                    `;

            });

        }


        function displayGrievances(data) {

            const list =
                document.getElementById("grievanceList");

            const count =
                document.getElementById("grievanceCount");

            list.innerHTML = "";

            count.textContent =
                `${data.length} grievance${data.length === 1 ? "" : "s"}`;


            if (data.length === 0) {

                list.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📭
                        </div>

                        <h3>
                            No grievances found
                        </h3>

                        <p>
                            Try changing your search or submit a new grievance.
                        </p>

                    </div>

                `;

                return;

            }


            data.forEach(grievance => {

                const card =
                    document.createElement("div");

                card.className =
                    "grievance-card";


                const status =
                    grievance.status || "Pending";

                const escalation =
                    grievance.escalationStatus || "Not Escalated";

                const category =
                    grievance.category || "Not Classified";

                const priority =
                    grievance.priority || "Not Classified";

                const department =
                    grievance.department || "Not Assigned";

                const slaHours =
                    grievance.slaHours || 0;

                const deadline =
                    grievance.slaDeadline ?
                    formatDate(grievance.slaDeadline) :
                    "Not Available";


                let statusClass =
                    "status-pending";

                if (status.toLowerCase() === "resolved") {
                    statusClass = "status-resolved";
                }

                if (
                    status.toLowerCase() === "escalated" ||
                    escalation.toLowerCase() === "escalated"
                ) {
                    statusClass = "status-escalated";
                }


                let priorityClass =
                    "priority-medium";

                if (priority === "LOW")
                    priorityClass = "priority-low";

                if (priority === "HIGH")
                    priorityClass = "priority-high";

                if (priority === "CRITICAL")
                    priorityClass = "priority-critical";


                const escalationClass =
                    escalation.toLowerCase() === "escalated" ?
                    "escalated" :
                    "not-escalated";


                card.innerHTML = `

                    <div class="card-top">

                        <span class="grievance-id">
                            GRIEVANCE #${grievance.id}
                        </span>

                        <span class="status ${statusClass}">
                            ${status}
                        </span>

                    </div>


                    <h3 class="grievance-title">
                        ${category}
                    </h3>


                    <p class="description">
                        ${grievance.grievance || "No description available."}
                    </p>


                    <div class="location">
                        📍 <strong>Location:</strong>
                        ${grievance.location || "Not provided"}
                    </div>


                    <div class="details">

                        <div class="detail">

                            <span class="detail-label">
                                Category
                            </span>

                            <span class="badge category">
                                ${category}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Priority
                            </span>

                            <span class="badge ${priorityClass}">
                                ${priority}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                Department
                            </span>

                            <span class="detail-value">
                                ${department}
                            </span>

                        </div>


                        <div class="detail">

                            <span class="detail-label">
                                SLA
                            </span>

                            <span class="detail-value">
                                ${slaHours > 0 ? slaHours + " Hours" : "Not Assigned"}
                            </span>

                        </div>

                    </div>


                    <div class="sla-section">

                        <div class="sla-row">

                            <span class="sla-label">
                                ⏱ SLA Deadline
                            </span>

                            <span class="sla-value">
                                ${deadline}
                            </span>

                        </div>


                        <div class="escalation ${escalationClass}">

                            ${escalation === "Escalated"
                                ? "🚨 SLA Breached — Escalated"
                                : "✓ No SLA Escalation"}

                        </div>

                    </div>


                    <div class="citizen">

                        <strong>Submitted by:</strong>
                        ${grievance.name || "Unknown"}

                        <br>

                        ${grievance.email || "Email not available"}

                    </div>

                `;


                list.appendChild(card);

            });

        }


        function filterGrievances() {

            const search =
                document.getElementById("searchInput")
                .value
                .toLowerCase();

            const priority =
                document.getElementById("priorityFilter")
                .value;


            const filtered =
                allGrievances.filter(g => {

                    const text = `

                        ${g.grievance || ""}
                        ${g.location || ""}
                        ${g.name || ""}
                        ${g.department || ""}
                        ${g.category || ""}
                        ${g.email || ""}

                    `.toLowerCase();


                    const matchesSearch =
                        text.includes(search);


                    const matchesPriority =
                        priority === "ALL" ||
                        (g.priority || "").toUpperCase() === priority;


                    return matchesSearch && matchesPriority;

                });


            displayGrievances(filtered);

        }


        function formatDate(dateString) {

            const date =
                new Date(dateString);

            if (isNaN(date.getTime())) {
                return dateString;
            }

            return date.toLocaleString("en-IN", {

                day: "2-digit",
                month: "short",
                year: "numeric",

                hour: "2-digit",
                minute: "2-digit"

            });

        }


        // Automatically load grievances
        loadGrievances();
    </script>

</body>

</html>
